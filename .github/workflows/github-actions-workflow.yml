name: Ink and Voices Workflow
run-name: Ink and Voices workflow is running.
on:
  pull_request:
    branches:
      - dev
jobs:
  tests_workflow:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      TEST_DATABASE: ${{ vars.TEST_DATABASE }}
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ink_test
      JWT_SECRET: test-secret
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Installe les dépendances
        run: npm ci
      - name: Génère le client Prisma
        run: npx prisma generate
      - name: Applique les migrations
        run: npx prisma migrate deploy
      - name: Lancer les tests
        run: npm run test:run
