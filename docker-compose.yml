#version: "3.9" considéré comme obsolète d'après le terminal

services:
  postgres:
    container_name: postgres
    image: postgres:16-alpine
    environment:
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=postgres
    - POSTGRES_DB=ink_and_voices
    - NODE_ENV=development
    - ADDRESS=0.0.0.0
    - PORT=8032
    - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ink_and_voices?schema=public #optional (specify default database instead of $POSTGRES_DB)
    ports:
      - "5433:5432"
    restart: always

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:9.11.0
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_MAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PW}
    ports:
      - "5050:80"
    restart: always

  dev:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8032:8032"
    environment:
      - NODE_ENV=development
      - ADDRESS=0.0.0.0
      - PORT=8032
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ink_and_voices?schema=public
      - LOCAL_DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ink_and_voices?schema=public
    volumes: # on mappe le dossier local à gauche sur le dossier distant dans le volume du container à droite
      - .:/app
      - /app/node_modules
      - /app/build # évite d'écraser le build du container
    command: npm start
    depends_on:
      - postgres
    #command: npm run dev  

  prod:
    build:
      context: .
    ports:
      - "8001:8001"
    environment:
      - NODE_ENV=production