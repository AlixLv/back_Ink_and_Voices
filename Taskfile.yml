# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  prisma-seed-databases:
    desc: prisma migrate and seed local db and test db
    cmds: 
      - docker exec back_ink_and_voices-dev-1 sh -c 
        'npx prisma db seed && echo "🔶 LOCAL_DATABASE_URL seeded!" && 
        LOCAL_DATABASE_URL=${TEST_DATABASE} npx prisma db seed && echo "🔷 TEST_DATABASE seeded!"'
        #'npx prisma db seed && echo "🔶 LOCAL_DATABASE_URL seeded!" && 
        #env NODE_ENV=test npx prisma db seed && echo "🔷 TEST_DATABASE seeded!"'

  prisma-migrate-db:
    desc: prisma migrate on local database
    cmds: 
      - docker exec back_ink_and_voices-dev-1 sh -c "npx prisma migrate dev"
      
  prisma-seed-db:
    desc: prisma seed on local database
    cmds: 
      - docker exec back_ink_and_voices-dev-1 sh -c "npx prisma db seed"

  prisma-migrate-test:
    desc: prisma migrate on test database
    cmds:
      - docker exec back_ink_and_voices-dev-1 sh -c 'NODE_ENV=test npx prisma migrate deploy'
  
  prisma-seed-test:
    desc: prisma seed on test database
    cmds:
      - docker exec back_ink_and_voices-dev-1 sh -c 'NODE_ENV=test npx prisma db seed'

  run-tests:
    desc: run the tests
    cmds: 
      - docker exec back_ink_and_voices-dev-1 sh -c "NODE_ENV=test npm run test"

